name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: cryptoplayerxaxa-art
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%238b5cf6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23c084fc

      - name: Publish generated SVG files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
